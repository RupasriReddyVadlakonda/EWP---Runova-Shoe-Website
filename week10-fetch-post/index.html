<!DOCTYPE html>
<html>
<head><title>Week 10 - POST using Fetch</title></head>
<body>
<h2>Add a Shoe (POST using Fetch)</h2>
<form id="shoeForm">
  <input name="name" placeholder="Shoe name" required><br><br>
  <input name="brand" placeholder="Brand" required><br><br>
  <input name="size" type="number" placeholder="Size" required><br><br>
  <input name="color" placeholder="Color" required><br><br>
  <input name="price" type="number" placeholder="Price" required><br><br>
  <button type="submit">Submit</button>
</form>

<h3>Server Response:</h3>
<pre id="out"></pre>

<script>
document.getElementById("shoeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  try {
    const res = await fetch("https://jsonplaceholder.typicode.com/posts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    document.getElementById("out").textContent = JSON.stringify(result, null, 2);
  } catch (err) {
    document.getElementById("out").textContent = "Error: " + err.message;
  }
});
</script>
</body>
</html>
