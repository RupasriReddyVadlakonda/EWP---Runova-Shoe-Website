<!DOCTYPE html>
<html>
<head>
    <title>Student Registration - JS Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>StepUp Shoes</h1>
        <p>Find the perfect pair for every step</p>
    </header>

    <div class="container">
        <h2 style="text-align:center;">Student Registration Form</h2>

        <!-- novalidate: browser checks are turned off so our JavaScript does the validation -->
        <form id="regForm" action="#" method="post" novalidate>

            <label>Full Name:</label>
            <input type="text" id="fullname" name="fullname">
            <span class="error" id="fullnameErr"></span>

            <label>Email:</label>
            <input type="email" id="email" name="email">
            <span class="error" id="emailErr"></span>

            <label>Password:</label>
            <input type="password" id="password" name="password">
            <span class="error" id="passwordErr"></span>

            <label>Confirm Password:</label>
            <input type="password" id="confirm" name="confirm">
            <span class="error" id="confirmErr"></span>

            <label>Phone Number:</label>
            <input type="tel" id="phone" name="phone">
            <span class="error" id="phoneErr"></span>

            <label>Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <span class="error" id="dobErr"></span>

            <label>Gender:</label>
            <div>
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>
            <span class="error" id="genderErr"></span>

            <label>Course:</label>
            <select id="course" name="course">
                <option value="">--Select Course--</option>
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>BCA</option>
                <option>B.Com</option>
                <option>MCA</option>
            </select>
            <span class="error" id="courseErr"></span>

            <label>Address:</label>
            <textarea id="address" name="address" rows="4"></textarea>
            <span class="error" id="addressErr"></span>

            <label>Hobbies:</label>
            <div style="margin-bottom:14px;">
                <input type="checkbox" name="hobby" value="Sports"> Sports
                <input type="checkbox" name="hobby" value="Reading"> Reading
                <input type="checkbox" name="hobby" value="Music"> Music
            </div>

            <input type="checkbox" id="terms"> I agree to the Terms and Conditions
            <span class="error" id="termsErr"></span>
            <br>

            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        </form>
    </div>

    <script src="js/validate.js"></script>
</body>
</html>
