<!DOCTYPE html>
<html>
<head>
    <title>StepUp Shoes - Login</title>
    <!-- INTERNAL CSS (this page only) -->
    <style>
        body { font-family: Verdana, sans-serif; background: linear-gradient(135deg, #1f2937, #c0392b); min-height: 100vh; margin: 0; }
        .login-box { width: 340px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
        .login-box h2 { text-align: center; color: #c0392b; margin-top: 0; }
        .login-box label { font-weight: bold; }
        .login-box input[type=email], .login-box input[type=password] { width: 100%; padding: 9px; margin: 6px 0 15px; border: 1px solid #bbb; border-radius: 5px; }
        .login-box input[type=submit] { width: 100%; padding: 10px; background: #c0392b; color: #fff; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .login-box input[type=submit]:hover { background: #922b21; }
        .login-box p { text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>StepUp Shoes Login</h2>
        <form action="#" method="post">
            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <input type="checkbox" name="remember"> Remember me<br><br>
            <input type="submit" value="Login">
        </form>
        <p>New user? <a href="register.html">Register here</a> | <a href="home.html">Home</a></p>
    </div>
</body>
</html>
